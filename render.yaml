services:
  # Service principal pour l'application web
  - type: web
    name: ncfd-app
    env: node
    buildCommand: yarn install --no-frozen-lockfile && yarn prisma:generate && node scripts/render-build.js
    startCommand: yarn start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --openssl-legacy-provider
      - key: DATABASE_URL
        fromDatabase:
          name: ncfd-db
          property: connectionString

  # Base de données PostgreSQL
databases:
  - name: ncfd-db
    plan: free
    ipAllowList: [] # permet l'accès public depuis n'importe où
