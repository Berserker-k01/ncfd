services:
  # Service principal pour l'application web
  - type: web
    name: ncfd-app
    env: node
    buildCommand: yarn install && yarn prisma:generate && yarn build
    startCommand: yarn start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ncfd-db
          property: connectionString

  # Base de données PostgreSQL
databases:
  - name: ncfd-db
    plan: free
    ipAllowList: [] # permet l'accès public depuis n'importe où
